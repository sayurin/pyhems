# Custom ECHONET Lite property definitions
#
# This file is processed by generate_definitions.py and merged into
# _definitions_generated.py. It is a build-time source; runtime YAML
# definitions are not supported.
#
# Format:
#   devices:
#     <class_code>:               # 2-byte class code as hex (e.g., 0x0135)
#       short_name: <name>        # Required for a class absent from MRA
#       name_en: <name>           # Required for a class absent from MRA
#       name_ja: <name>           # Required for a class absent from MRA
#       properties:
#         - mode: define           # Optional; defaults to "define"
#           epc: <epc_code>       # EPC as hex (e.g., 0xF1)
#           manufacturer_code: <code>  # Optional 3-byte manufacturer code
#           byte_offset: <offset> # Optional EDT byte position (0-indexed)
#           # define requires either format or enum_values, and name_en/name_ja/get.
#           # Two-value enum keys must be one of the generator's classified
#           # boolean or non-boolean pairs. Boolean pairs become true/false.
#           format: <mra_format>
#           unit: <mra_unit>
#           minimum: <min>
#           maximum: <max>
#           multipleOf: <scale>
#           enum_values: [...]
#           name_en: <name>
#           name_ja: <name>
#           role: <role>
#
# mode: define creates a fully specified property for an EPC that is absent
# from the device MRA. A definition for a common EPC replaces that common
# definition for the specified class. mode: patch selectively updates an
# existing device MRA EPC; unspecified fields, including enum display names,
# are preserved.
#
# A generic define and a manufacturer-specific define may not share an
# (EPC, byte_offset). Multiple enum defines for one EPC/manufacturer are not
# supported because Home Assistant's enum entity keys do not include offsets.

devices:
  # Air cleaner (空気清浄機)
  0x0135:
    properties:
      - epc: 0xF1
        manufacturer_code: 0x000005
        byte_offset: 1
        enum_values:
          - edt: 0x00
            key: "true"
            name_en: "Bright"
            name_ja: "明るい"
          - edt: 0x01
            key: "false"
            name_en: "Dark"
            name_ja: "暗い"
        get: optional
        name_en: "Illuminance"
        name_ja: "照度"
      - epc: 0xF1
        manufacturer_code: 0x000005
        byte_offset: 3
        format: int8
        unit: Celsius
        minimum: -127
        maximum: 125
        get: optional
        name_en: "Temperature"
        name_ja: "温度"
      - epc: 0xF1
        manufacturer_code: 0x000005
        byte_offset: 4
        format: uint8
        unit: "%RH"
        minimum: 0
        maximum: 100
        get: optional
        name_en: "Humidity"
        name_ja: "湿度"
      - epc: 0xF1
        manufacturer_code: 0x000005
        byte_offset: 28
        format: uint8
        unit: "µg/m³"
        minimum: 0
        maximum: 255
        get: optional
        name_en: "PM2.5"
        name_ja: "PM2.5"

