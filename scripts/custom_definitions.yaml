# Custom ECHONET Lite property definitions
#
# This file is processed by generate_definitions.py and merged into
# definitions.json. Custom entries are mixed with MRA entries in the
# same device class.
#
# Users can create their own definitions in config/echonet_lite.yaml
# using the same format (processed at runtime, not by the generator).
#
# Format:
#   devices:
#     <class_code>:               # 2-byte class code as hex (e.g., 0x0135)
#       - epc: <epc_code>         # EPC as hex (e.g., 0xF1)
#         manufacturer_code: <code>  # Optional: 3-byte manufacturer code (e.g., 0x000005)
#         byte_offset: <offset>   # Optional: byte position in EDT (0-indexed)
#         # For sensor entities:
#         format: <mra_format>    # MRA format: "uint8", "int8", "uint16", etc.
#         unit: <mra_unit>        # MRA unit: "Celsius", "W", "%RH", etc.
#         minimum: <min>          # Optional: minimum valid value (before scale)
#         maximum: <max>          # Optional: maximum valid value (before scale)
#         multipleOf: <scale>     # Optional: scale factor (default: 1.0)
#         # For binary/select entities:
#         enum_values: [...]      # List of {edt, key, name_en, name_ja}
#         # Common fields:
#         name_en: <name>         # English name (required for strings.json)
#         name_ja: <name>         # Optional: Japanese name
#
# Behavior is auto-detected based on whether the EPC exists in MRA:
#   - EPC NOT in MRA → ADD: creates a new custom entity
#   - EPC found in MRA → UPDATE: patches the existing MRA entity
#
# For ADD entries, IDs are auto-generated as:
#   class_{class_code}_custom_{mfr_code}_epc_{epc}_{index}
# where index is a sequential number (1, 2, ...) for entries sharing the same EPC.
#
# For UPDATE entries (overrides), any field except epc/manufacturer is applied
# to the matching MRA entity. enum_values uses key-based merge (match by "key",
# update name_en/name_ja).
#
# Note: When byte_offset is specified, multiple entities can be created from
# a single EPC. Each entity reads a slice of the EDT data.

devices:
  # Air cleaner (空気清浄機)
  # Sharp Corporation - EPC 0xF1 not in MRA → ADD
  0x0135:
    - epc: 0xF1
      manufacturer_code: 0x000005
      byte_offset: 3
      format: int8
      unit: Celsius
      minimum: -127
      maximum: 125
      get: optional
      name_en: "Temperature"
      name_ja: "温度"
    - epc: 0xF1
      manufacturer_code: 0x000005
      byte_offset: 4
      format: uint8
      unit: "%RH"
      minimum: 0
      maximum: 100
      get: optional
      name_en: "Humidity"
      name_ja: "湿度"
    - epc: 0xF1
      manufacturer_code: 0x000005
      byte_offset: 28
      format: uint8
      unit: "µg/m³"
      minimum: 0
      maximum: 255
      get: optional
      name_en: "PM2.5"
      name_ja: "PM2.5"

  # Air conditioner ventilation fan (空調換気扇)
  # Heat exchanger operation setting (熱交換機動作設定) EPC 0xE0
  # MRA bug: "false" (OFF) is incorrectly labeled "Heat exchanger ON"
  # EPC 0xE0 exists in MRA → UPDATE
  0x0134:
    - epc: 0xE0
      enum_values:
        - key: "false"
          name_en: "Heat exchanger OFF"
