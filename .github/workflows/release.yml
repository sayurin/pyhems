name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing published release tag to safely retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require GitHub App configuration
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Configure APP_ID and APP_PRIVATE_KEY for the release GitHub App."
            exit 1
          fi

      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare-release:
    needs: release-please
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
      )
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release state and resolve immutable revision
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
          EXPECTED_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $TAG_NAME"
            exit 1
          fi
          release="$(gh release view "$TAG_NAME" --json isDraft,isPrerelease,tagName)"
          [[ "$(jq -r .tagName <<<"$release")" == "$TAG_NAME" ]]
          [[ "$(jq -r .isDraft <<<"$release")" == false ]]
          [[ "$(jq -r .isPrerelease <<<"$release")" == false ]]
          tag_sha="$(git rev-parse "refs/tags/$TAG_NAME^{commit}")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$tag_sha" == "$EXPECTED_SHA" ]]
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            if [[ "$latest_tag" != "$TAG_NAME" ]]; then
              echo "::error::The newly created release is not GitHub's latest release."
              exit 1
            fi
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.1
          enable-cache: false

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Verify tag version
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$(uv version --short)" == "${TAG_NAME#v}" ]]

      - name: Build package
        run: uv build

      - name: Check distributions
        run: uv run --locked --extra dev twine check dist/*

      - name: Attach distributions without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          asset_names="$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          for artifact in dist/*; do
            name="$(basename "$artifact")"
            if grep -Fqx -- "$name" <<<"$asset_names"; then
              gh release download "$TAG_NAME" --pattern "$name" --dir "$RUNNER_TEMP/release-assets"
              if ! cmp --silent "$artifact" "$RUNNER_TEMP/release-assets/$name"; then
                echo "::error::Existing release asset $name does not match the rebuilt distribution."
                exit 1
              fi
            else
              gh release upload "$TAG_NAME" "$artifact"
            fi
          done

  publish:
    needs: [release-please, prepare-release]
    if: |
      always() &&
      needs.prepare-release.result == 'success' &&
      (
        (github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.1
          enable-cache: false

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Verify release assets and build distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          [[ "$(uv version --short)" == "${TAG_NAME#v}" ]]
          [[ "$(git rev-parse "refs/tags/$TAG_NAME^{commit}")" == "$(git rev-parse HEAD)" ]]
          release="$(gh release view "$TAG_NAME" --json isDraft,isPrerelease,tagName)"
          [[ "$(jq -r .tagName <<<"$release")" == "$TAG_NAME" ]]
          [[ "$(jq -r .isDraft <<<"$release")" == false ]]
          [[ "$(jq -r .isPrerelease <<<"$release")" == false ]]
          uv build
          uv run --locked --extra dev twine check dist/*
          mkdir -p "$RUNNER_TEMP/release-assets"
          for artifact in dist/*; do
            name="$(basename "$artifact")"
            gh release download "$TAG_NAME" --pattern "$name" --dir "$RUNNER_TEMP/release-assets"
            if ! cmp --silent "$artifact" "$RUNNER_TEMP/release-assets/$name"; then
              echo "::error::GitHub asset $name does not match the rebuilt distribution."
              exit 1
            fi
          done

      - name: Verify existing PyPI files before retry-safe publication
        env:
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: uv run --locked --extra dev python -m scripts.check_pypi_artifacts "$TAG_NAME" dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Verify all published PyPI files
        env:
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: uv run --locked --extra dev python -m scripts.check_pypi_artifacts "$TAG_NAME" dist --complete
