name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
      existing_version:
        description: "Recover an existing tag instead of bumping the version (for example, 0.8.16)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    outputs:
      release_version: ${{ steps.bump_version.outputs.new_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.existing_version != '' && format('v{0}', inputs.existing_version) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Bump version
        id: bump_version
        env:
          BUMP: ${{ inputs.bump }}
          EXISTING_VERSION: ${{ inputs.existing_version }}
        run: |
          if [[ -n "$EXISTING_VERSION" ]]; then
            if [[ ! "$EXISTING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid existing version: $EXISTING_VERSION"
              exit 1
            fi
            if [[ "$(uv version --short)" != "$EXISTING_VERSION" ]]; then
              echo "::error::The checked out tag does not contain version $EXISTING_VERSION"
              exit 1
            fi
          else
            uv version --bump "$BUMP"
          fi
          echo "new_version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        if: ${{ inputs.existing_version == '' }}
        env:
          RELEASE_VERSION: ${{ steps.bump_version.outputs.new_version }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${RELEASE_VERSION} already exists"
            exit 1
          fi

      - name: Commit and tag
        if: ${{ inputs.existing_version == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Release v${{ steps.bump_version.outputs.new_version }}"
          git tag "v${{ steps.bump_version.outputs.new_version }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD --tags

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: prepare
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  github-release:
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: "v${{ needs.prepare.outputs.release_version }}"
          files: dist/*
          generate_release_notes: true
