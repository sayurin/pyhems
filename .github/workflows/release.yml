name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft release tag to rebuild and reattach
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require GitHub App configuration
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Configure APP_ID and APP_PRIVATE_KEY for the release GitHub App."
            exit 1
          fi

      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@v2.2.2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v4.4.1
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare-draft:
    needs: release-please
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: 0.13.1
          enable-cache: false

      - name: Verify draft release and version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG_NAME"
            exit 1
          fi
          if [[ "$(uv version --short)" != "${TAG_NAME#v}" ]]; then
            echo "::error::The tag version does not match pyproject.toml."
            exit 1
          fi
          if [[ "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" != "true" ]]; then
            echo "::error::The release for $TAG_NAME is not a draft."
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Check distributions
        run: uv run --locked --extra dev twine check dist/*

      - name: Attach distributions to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber

  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: 0.13.1
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Check distributions
        run: uv run --locked --extra dev twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
